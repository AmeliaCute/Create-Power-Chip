plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = "https://maven.ithundxr.dev/mirror" } //Registrate

    maven { url = "https://maven.blamejared.com" } // JEI

    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.terraformersmc.com/" }

    maven { url "https://cursemaven.com" }
}

legacyForge {
    version = "${minecraft_version}-${neoforge_version}"

    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperties.put("mixin.debug.export", "true")
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--all', '--mod', mod_id,
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = "2023.09.03"
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')
    implementation('org.jetbrains:annotations:26.1.0')
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.5"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))

    modRuntimeOnly("mezz.jei:jei-${jei_minecraft_version}-forge:${jei_version}")


    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")

    modImplementation "org.patryk3211.powergrid:powergrid-forge:mc1.20.1-0.6.2"
    modImplementation "dev.architectury:architectury-forge:${architectury_api_version}"
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version,
            neoforge_version_range: neoforge_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_group_id: mod_group_id,
            powergrid_version: powergrid_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

mixin {
    add sourceSets.main, 'powerchip.mixins.refmap.json'
    config 'powerchip.mixins.json'
}

jar {
    manifest.attributes([
            "MixinConfigs": "powerchip.mixins.json"
    ])
}